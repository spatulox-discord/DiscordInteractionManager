name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm test needs Node 21+ (see devEngines)
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # The published CLI must start on every Node version of "engines"
  start:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Start without a token
        run: |
          set +e
          output=$(node dist/MainCLI.js 2>&1)
          code=$?
          echo "$output"
          [ "$code" -eq 1 ] && echo "$output" | grep -q "Missing environment variable : DISCORD_BOT_TOKEN"
